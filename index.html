<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Log sets, reps and weights on gym machines, track personal bests and get workout suggestions.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --bg:#000;--fg:#fff;--mute:#9b9b9b;--dim:#5f5f5f;--line:#262626;--plate:#1b1b1b;--plate-2:#333;
  --h0:#1b1b1b;--h1:#4d4d4d;--h2:#8a8a8a;--h3:#c9c9c9;--h4:#fff;
  --wash:rgba(255,255,255,.1);
  --gut:16px;--tabh:64px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#fff;--fg:#000;--mute:#666;--dim:#a6a6a6;--line:#e3e3e3;--plate:#efefef;--plate-2:#d6d6d6;
  --h0:#ececec;--h1:#bdbdbd;--h2:#838383;--h3:#454545;--h4:#000;
  --wash:rgba(0,0,0,.07);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{opacity:.3;cursor:default}
input,select{font:inherit;color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-stretch:62%;font-weight:800;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mt{margin-top:12px}

/* header + tabs */
#app{max-width:720px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--safe-t) + 12px) var(--gut) 10px;background:var(--bg)}
.brand{font-stretch:62%;font-weight:900;font-size:21px;letter-spacing:.02em;line-height:1}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);padding:6px 0;min-height:32px}
.sync i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.sync.ok i{background:currentColor}
.sync.err{color:var(--fg)}
.sync.err i{border-radius:1px;transform:rotate(45deg);background:currentColor}
.sync.busy i{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
main{padding:0 var(--gut) calc(var(--tabh) + var(--safe-b) + 90px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .in{display:flex;max-width:720px;margin:0 auto}
.tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:550;color:var(--mute);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--fg)}
.tabs button[aria-current=page]::before{content:'';position:absolute;top:-1px;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--fg)}

/* type + structure */
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec.first{border-top:0;padding-top:8px}
.h{font-stretch:75%;font-weight:750;font-size:23px;line-height:1.1;letter-spacing:-.01em}
.h3{font-weight:650;font-size:15px;margin:22px 0 6px}
.sub{color:var(--mute);font-size:14px;margin-top:4px;max-width:62ch}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head .sub{margin:0;text-align:right}
.empty{padding:20px 0;color:var(--mute);max-width:52ch}

/* buttons + chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--fg);font-weight:650;font-size:16px;white-space:nowrap;text-align:center}
.btn svg{width:22px;height:22px}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 15px;font-size:14px}
.btn.sm svg{width:18px;height:18px}
.btn.big{min-height:62px;font-size:17px}
.btn.xl{min-height:64px;font-size:19px;width:100%}
.btn:active{transform:scale(.985)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:2px var(--gut)}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:550;color:var(--mute);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px}
.seg button{height:38px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute);text-align:center;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:750}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn svg{width:24px;height:24px}

/* today */
.hero{padding:6px 0 24px}
.date{font-stretch:62%;font-weight:850;font-size:56px;line-height:.9;letter-spacing:-.015em}
.date span{display:block;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.day b{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border-radius:8px;background:var(--plate);color:var(--mute);font-size:21px}
.day.on b{background:var(--fg);color:var(--bg)}
.day.today span{color:var(--fg);font-weight:750}
.day.today b{box-shadow:inset 0 0 0 2px var(--fg);color:var(--fg)}
.day.on.today b{box-shadow:inset 0 0 0 2px var(--fg),inset 0 0 0 4px var(--bg);color:var(--bg)}
.day.future b{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--dim)}
.weekline{margin-top:16px;color:var(--mute);font-size:15px;max-width:52ch}
.weekline b{color:var(--fg);font-weight:650}
.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;padding-bottom:26px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--plate);font-size:14px;margin-bottom:14px}
.notice .btn{flex:none}
.sugg{list-style:none;margin-top:6px}
.srow,.xrow,.mrow,.pbrow{width:100%;display:grid;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
.srow{grid-template-columns:24px 1fr auto}
.sec > .xrow:last-child,.sec > .pbrow:last-child,.sugg li:last-child .srow,.daydetail .dd-row:last-child,#mlist > .mrow:last-child{border-bottom:0}
.srow .idx{font-size:22px;color:var(--dim)}
.srow b,.xrow b,.mrow b,.pbrow b{display:block;font-weight:650;line-height:1.25}
.srow small,.xrow small,.mrow small,.pbrow small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.tgt{text-align:right;white-space:nowrap}
.tgt b{font-size:30px;line-height:.95}
.srow.done{opacity:.4}
.why{margin:12px 0 2px}
.xrow{grid-template-columns:1fr 20px}
.xrow .chev{width:20px;height:20px;color:var(--dim)}
.setchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.setchips i{font-style:normal;font-size:13px;line-height:1;padding:5px 8px;border-radius:6px;background:var(--plate);font-variant-numeric:tabular-nums}
.setchips i.pb{background:var(--fg);color:var(--bg);font-weight:700}
.rec{display:grid;grid-template-columns:1fr}
@media (min-width:560px){.rec{grid-template-columns:1fr 1fr;column-gap:28px}}
.rrow{width:100%;display:grid;grid-template-columns:94px 1fr 54px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.rrow .when{font-size:13px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.plates i{height:12px;border-radius:3px;background:var(--plate-2)}
.plates i.on{background:var(--fg)}
.plates.none i{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* machines */
.search{display:block;width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 18px;font-size:16px;color:var(--fg)}
.search::placeholder{color:var(--dim)}
.mrow{grid-template-columns:1fr 64px 72px}
.mrow .val small{white-space:nowrap}
.mrow.pick{grid-template-columns:1fr 76px}
.mrow .val{text-align:right}
.mrow .val b{font-size:26px;line-height:1}
.mrow.off{opacity:.5}
.spark{display:flex;justify-content:center;color:var(--fg)}

/* progress */
.chart{position:relative;width:100%;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;left:0;top:0;z-index:3;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.3;white-space:nowrap;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-size:17px;font-weight:750}
.axis{fill:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.grid{stroke:var(--line);stroke-width:1}
.axisline{stroke:var(--dim);stroke-width:1}
.line{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--wash)}
.dot{fill:var(--fg);stroke:var(--bg);stroke-width:2}
.dot-pb{fill:var(--bg);stroke:var(--fg);stroke-width:2.5}
.xh{stroke:var(--mute);stroke-width:1;opacity:0}
.focus{fill:var(--fg);stroke:var(--bg);stroke-width:2;opacity:0}
.bar{fill:var(--fg)}
.bar.cur{fill:var(--h2)}
.bar.hov{fill:var(--h3)}
.hit{fill:transparent;cursor:pointer}
.hc{cursor:pointer}
.l0{fill:var(--h0)}.l1{fill:var(--h1)}.l2{fill:var(--h2)}.l3{fill:var(--h3)}.l4{fill:var(--h4)}
i.l0{background:var(--h0)}i.l1{background:var(--h1)}i.l2{background:var(--h2)}i.l3{background:var(--h3)}i.l4{background:var(--h4)}
.hc.today{stroke:var(--mute);stroke-width:1}
.selring{fill:none;stroke:var(--fg);stroke-width:1.5;pointer-events:none}
.heat-key{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:12px;color:var(--mute)}
.heat-key i{width:11px;height:11px;border-radius:2px}
.heat-key span{margin:0 4px}
.chart-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:8px}
.chart-note .k-pb{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--fg)}
.chart-note .k-cur{width:11px;height:11px;border-radius:2px;background:var(--h2)}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.ring.target{stroke:var(--dim);stroke-width:1.5}
.rpoly{fill:var(--wash);stroke:var(--fg);stroke-width:2;stroke-linejoin:round}
.rlab{fill:var(--mute);font-size:12px}
.daydetail{margin-top:18px;border-top:1px solid var(--line)}
.dd-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:10px 0}
.dd-head div{text-align:center}
.dd-head b{display:block;font-stretch:75%;font-weight:750;font-size:19px}
.dd-head small{display:block;color:var(--mute);font-size:13px}
.dd-row{width:100%;display:block;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.dd-row b{font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:18px 0 6px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat b{display:block;font-stretch:62%;font-weight:800;font-size:40px;line-height:.95}
.stat b small{font-size:18px;font-weight:700;color:var(--mute);margin-left:2px}
.stat span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--fg);margin-top:2px}
.pbrow{grid-template-columns:1fr auto}
.pbv{text-align:right;white-space:nowrap}
.pbv b{font-size:30px;line-height:.95}
.pbrow .badge{margin-left:6px;vertical-align:2px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th{color:var(--mute);font-weight:550}
.tbl td:last-child,.tbl th:last-child{text-align:right}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set-row small{display:block;color:var(--mute);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.sec > .set-row:last-child{border-bottom:0}
.tog{width:52px;height:32px;border-radius:999px;background:var(--plate-2);position:relative;flex:none;transition:background .15s}
.tog::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
[aria-checked=true] .tog{background:var(--fg)}
[aria-checked=true] .tog::after{transform:translateX(20px);background:var(--bg)}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.form input:not([type=checkbox]):not([type=radio]),.form select{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;color:var(--fg);width:100%}
.form .check{display:flex;align-items:center;gap:10px;color:var(--fg)}
.form .check input{width:20px;height:20px;accent-color:var(--fg)}
.form fieldset{border:0;display:grid;gap:6px}
.form legend{font-size:14px;color:var(--mute);margin-bottom:6px}
.radio-chips{display:flex;gap:8px;flex-wrap:wrap}
.radio-chips input{position:absolute;opacity:0;pointer-events:none}
.radio-chips span{display:inline-flex;align-items:center;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--mute);cursor:pointer}
.radio-chips input:checked + span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.radio-chips input:focus-visible + span{outline:2px solid var(--fg);outline-offset:2px}
details.help{margin-top:14px;font-size:14px;color:var(--mute)}
details.help summary{cursor:pointer;color:var(--fg);font-weight:600;padding:6px 0}
details.help ol{padding-left:20px;display:grid;gap:6px;margin-top:6px}
details.help p{margin-top:8px}
.status{font-size:14px;margin-top:10px;color:var(--mute)}
.status.err{color:var(--fg)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50}
.sheet{background:var(--bg);display:flex;flex-direction:column;animation:sheetIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 6px) 8px 6px;border-bottom:1px solid var(--line)}
.sh-head > *{max-width:720px}
.sh-title{flex:1;min-width:0}
.sh-title h2{font-stretch:75%;font-weight:750;font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-title p{color:var(--mute);font-size:13px}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px var(--gut) 28px;width:100%;max-width:720px;margin:0 auto}
.sh-foot{display:flex;flex-direction:column;gap:8px;width:100%;max-width:720px;margin:0 auto;padding:10px var(--gut) calc(10px + var(--safe-b));border-top:1px solid var(--line)}
.editbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editbar[hidden]{display:none}
.menu{padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-l{font-weight:650;font-size:14px;margin:12px 0 8px}
.note{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:2px 0 4px}
.note svg{width:18px;height:18px;color:var(--mute)}
.note input{flex:1;min-width:0;background:transparent;border:0;font-size:16px;padding:10px 0;color:var(--fg)}
.note input::placeholder{color:var(--dim)}
.note input:focus{outline:none}
.note:focus-within{border-bottom-color:var(--fg)}
.last{font-size:14px;color:var(--mute);margin:12px 0 4px;min-height:20px}
.last b{color:var(--fg);font-weight:650}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;margin:12px 0 6px}
.stack-wrap{position:relative;height:236px}
.stack{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;padding:96px 22px 96px 0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 76%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 76%,transparent 100%);touch-action:pan-y}
.stack::-webkit-scrollbar{display:none}
.plate{height:44px;padding:3px 0;scroll-snap-align:center;cursor:pointer}
.plate b{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 13px;border-radius:6px;background:var(--plate);color:var(--dim);font-stretch:62%;font-weight:750;font-size:19px;font-variant-numeric:tabular-nums}
.plate b::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--bg);flex:none}
.plate.lift b{background:var(--plate-2);color:var(--mute)}
.plate.sel b{background:var(--fg);color:var(--bg)}
.pin{position:absolute;top:50%;right:0;width:36px;height:6px;margin-top:-3px;border-radius:3px;background:var(--mute);pointer-events:none}
.pin::after{content:'';position:absolute;right:-2px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--mute);box-shadow:0 0 0 3px var(--bg)}
.addon{position:absolute;right:0;top:calc(50% + 14px);font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.read{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0}
.rd{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;min-width:0}
.val{flex:none;width:2.4ch;min-width:1.3ch;max-width:calc(100% - 44px);background:transparent;border:0;border-radius:8px;font-size:72px;line-height:.92;padding:0;color:var(--fg)}
.val:focus{outline:none;box-shadow:0 2px 0 var(--fg)}
.unit{font-size:15px;color:var(--mute);flex:none}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm button{height:48px;border-radius:999px;border:1px solid var(--line);font-weight:650;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.pm button:active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.setrow{width:100%;display:grid;grid-template-columns:30px 1fr auto 44px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.setrow .n{color:var(--dim);font-stretch:62%;font-weight:750;font-size:22px}
.setrow .wr{font-weight:650;font-size:17px}
.setrow .tm{color:var(--mute);font-size:13px;text-align:right}
.setrow.editing{background:var(--plate);border-radius:10px;padding-left:10px;padding-right:10px}
.setrow.new{animation:rowIn .5s ease-out}
@keyframes rowIn{from{background:var(--plate-2)}to{background:transparent}}
.exstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 4px}
.exstats .stat b{font-size:32px}
.hrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow > span:first-child{color:var(--mute);padding-top:5px}
.hrow .setchips{margin-top:0}
.modal{background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px 20px 18px;animation:sheetIn .18s ease-out}

/* rest timer */
.rest-slot:empty{display:none}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe-b) + 10px);width:calc(100% - 32px);max-width:688px;z-index:25}
.restbar{position:relative;isolation:isolate;display:flex;align-items:center;gap:6px;height:52px;border-radius:999px;background:var(--plate-2);overflow:hidden;padding:0 6px 0 20px}
.restbar .fill{position:absolute;inset:0;background:var(--fg);transform-origin:left center;z-index:-1}
.restbar .rt{flex:1;font-stretch:62%;font-weight:800;font-size:27px;color:#fff;mix-blend-mode:difference;font-variant-numeric:tabular-nums}
.restbar button{height:40px;padding:0 14px;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:650;font-size:14px}
.restbar.done{animation:pulse .9s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03)}}

/* scanner */
.scan{background:#000;color:#fff;display:flex;flex-direction:column}
.scan .sh-head{border-bottom:0}
.viewport{position:relative;flex:1;overflow:hidden;background:#111}
.viewport video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder{position:absolute;left:50%;top:50%;width:min(68vw,300px);aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:20px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.finder svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px)}
.scan-msg{padding:16px var(--gut) 6px;text-align:center;font-size:15px;max-width:460px;margin:0 auto}
.scan-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px var(--gut) calc(18px + var(--safe-b))}
.scan .btn{border-color:#fff;color:#fff}
.scan .btn.ghost{border-color:#555}

/* toast + PB stamp */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 72px);z-index:90;display:flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:15px;font-weight:550;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toast button{font-weight:800;text-decoration:underline;padding:2px 0 2px 10px}
body.locked #toast{bottom:calc(var(--safe-b) + 150px)}
.stamp{position:fixed;left:50%;top:40%;z-index:95;pointer-events:none;text-align:center;background:var(--bg);color:var(--fg);border:4px solid var(--fg);border-radius:16px;padding:10px 24px 12px;transform:translate(-50%,-50%) rotate(-7deg);animation:stamp 1.6s cubic-bezier(.2,.9,.3,1.1) forwards}
.stamp b{display:block;font-stretch:62%;font-weight:900;font-size:76px;line-height:.85}
.stamp span{display:block;font-size:16px;font-weight:650;margin-top:4px}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(1.9)}14%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}78%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .stamp{animation:none}
}
@media (min-width:760px){.date{font-size:72px}}

const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

const fmtShort = t => { const d = new Date(t); return d.getDate() + ' ' + MON[d.getMonth()]; };

function nice(min, max, n) {

  return { lo, hi, ticks };
}

}

const OV = [];
let SKIP = 0;
function mkOv(id, html, opts) {

  el.dataset.ov = id;
  el.innerHTML = html;
  $('#layer').appendChild(el);
  document.body.classList.add('locked');

}
function openOv(id, html, opts = {}) {
  const el = mkOv(id, html, opts);

  OV.push({ id, el, onClose: opts.onClose, pushed });
  return el;
}
function replaceTop(id, html, opts = {}) {

  if (o) { pushed = o.pushed; o.el.remove(); if (o.onClose) o.onClose(); }
  const el = mkOv(id, html, opts);
  OV.push({ id, el, onClose: opts.onClose, pushed });
  return el;
}
function closeOv(fromPop) {
  const o = OV.pop(); if (!o) return;
  o.el.remove();
  if (!OV.length) document.body.classList.remove('locked');
  if (o.onClose) o.onClose();
  if (!fromPop && o.pushed && history.state && history.state.ironlog) { SKIP++; history.back(); }
}

function mountStack() {

  st.innerHTML = Array.from({ length: n }, (_, i) => `<div class="plate" data-i="${i}" role="option"><b>${fmtW((i + 1) * step)}</b></div>`).join('');
  UI.stack = { el: st, step, n, lock: false, lt: 0, raf: 0, idx: -1 };
  st.addEventListener('scroll', onStackScroll, { passive: true });
  const takeOver = () => { if (UI.stack) { UI.stack.lock = false; clearTimeout(UI.stack.lt); } };

}

const SCAN = { stream: null, raf: 0, det: null, busy: false, nfc: null };

    <div class="viewport"><video id="cam" playsinline muted autoplay></video><div class="finder" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M2 24V12A10 10 0 0 1 12 2h12M76 2h12a10 10 0 0 1 10 10v12M98 76v12a10 10 0 0 1-10 10H76M24 98H12A10 10 0 0 1 2 88V76"/></svg></div></div>
    <p class="scan-msg" id="scanMsg">Starting the camera…</p>
    <div class="scan-actions">${NFC_OK ? `<button class="btn" data-act="nfc">${icon('nfc')}Read NFC tag</button>` : ''}${linking ? '' : `<button class="btn ghost" data-act="pickFromScan">${icon('list')}Choose from list</button>`}</div>`, { cls: 'scan', onClose: stopScanner });

}
const scanMsg = m => { const e = $('#scanMsg'); if (e) e.textContent = m; };
async function startCamera(el) {

    SCAN.stream = stream;
    const v = $('#cam', el);
    v.srcObject = stream;
    await v.play().catch(() => {});
    scanMsg('Point the camera at the QR code on the machine.');
    SCAN.det = await getDetector();
    loopScan(v);
  } catch (err) {
    scanMsg(err && err.name === 'NotAllowedError' ? 'Camera access is blocked. Allow the camera for this site in your browser settings, or choose the machine from the list.'

}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => (window.jsQR ? res() : rej(new Error('decoder'))); s.onerror = () => rej(new Error('decoder')); document.head.appendChild(s); }); }

    try {

      if (f.includes('qr_code')) { const bd = new window.BarcodeDetector({ formats: ['qr_code'] }); return async v => { const r = await bd.detect(v); return r[0] ? r[0].rawValue : null; }; }

  }
  if (!window.jsQR) await loadScript('jsQR.js').catch(() => loadScript(JSQR_CDN));

    const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
    const sc = Math.min(1, 720 / Math.max(vw, vh));
    c.width = Math.round(vw * sc); c.height = Math.round(vh * sc);

    const r = window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });

  let last = 0;

      last = ts; SCAN.busy = true;
      let code = null;
      try { code = await SCAN.det(v); } catch (e) {}

      if (code && String(code).trim()) { onCode('qr:' + String(code).trim()); return; }

}

  const t = p === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
  document.documentElement.dataset.theme = t;
  const m = $('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#ffffff' : '#000000';
}

/* ============================== start ============================== */
function init() {
  $('#tabs').innerHTML = '<div class="in">' + [['today', 'Today'], ['machines', 'Machines'], ['progress', 'Progress'], ['settings', 'Settings']].map(([k, n]) => `<button data-act="tab" data-tab="${k}">${icon(k)}<span>${n}</span></button>`).join('') + '</div>';
  D = derive();
  applyTheme();
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: light)'); const h = () => { if (kvGet('pref:theme', 'dark') === 'auto') applyTheme(); }; if (mq.addEventListener) mq.addEventListener('change', h); }
  render();
  const q = new URLSearchParams(location.search), m = q.get('m') || q.get('machine'), tag = q.get('tag');
  if (m && exById(m)) openLog(m);
  else if (tag) onCode('link:' + tag);
  if (syncCfg()) { setSync('pending', ''); syncSoon(600); } else setSync('off');
  setInterval(() => { if (UI.tab === 'today' && !OV.length && !isTyping() && document.visibilityState === 'visible') render(); }, 60000);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
